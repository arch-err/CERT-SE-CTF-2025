<!DOCTYPE html>

    <title>64x64 bit grid</title>
    <style>
      :root {
        --px: 10px; /* size of each pixel */
      }
      body {
        background: #111;
        margin: 2rem;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(64, var(--px));
        grid-auto-rows: var(--px);
        line-height: 0;
        box-shadow: 0 0 0 2px #000 inset;
      }
      .grid > span {
        width: var(--px);
        height: var(--px);
        display: inline-block;
        background: #000; /* default OFF = black */
      }
